# Repository Web configuration template, version 1.
# config init expands ${repoRoot} ONLY in hmr.config.root path fields.
# Edit cordis.local.patch.yml after initialization; this template is not loaded.
- id: hmr
  config:
    root:
      - '${repoRoot}/app-restart/lib'
      - '${repoRoot}/approval-allowlist/lib'
      - '${repoRoot}/desktop-notify/lib'
      - '${repoRoot}/notify-web/lib'
    ignored:
      - '**/node_modules'
      - '**/.*'
      - 'cache'
      - 'data'
      - '**\\node_modules'
      - '**\\.*'

# Install @local/notify-web via the plugin manager before starting with this row.
# To run without it, remove this row from your local patch.
- id: notify-web
  config:
    notifyOnApproval: true
    approvalDelayMs: 300
    notifyOnTurnEnd: true
    notifyOnTurnError: true
    heartbeatMs: 15000
    replayWindowMs: 120000
    maxReplayEntries: 256
    maxQueuedUpdates: 256

# Keep private endpoints, paths and exact approval rules in the local file.
# No approval rule is installed or enabled by config init.
