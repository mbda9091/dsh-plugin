name: Plugin tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-fast:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.28.5
      - run: pnpm install --frozen-lockfile
      # No personal config, real DSH, browser, or plugin build. DEV/ISO use owned local servers.
      - run: node scripts/dev.mjs test-env --suite fast

  environment-real:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DSH_E2E_BROWSER: chromium
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.28.5
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      # Real suite exports clean source, freezes again in a fresh store/home,
      # probes public DSH/internal pnpm and a real tgz. DEV also verifies persistent
      # Web lifecycle, source links, revised code loading and safe reset in a fixture.
      # ISO covers isolation; ART exercises fixed tarballs and real L4/L5 evidence.
      - run: node scripts/dev.mjs test-env --suite real

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DSH_E2E_BROWSER: chromium
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned toolchain
        run: npm install --global pnpm@11.28.5
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install matching Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Environment evidence gate, type check and L1-L5 (shared local entry)
        run: node scripts/dev.mjs ci --keep
      # Raw logs, screenshots and traces stay on the ephemeral runner. They may
      # contain temporary launch/auth tokens and are not uploaded as artifacts.
