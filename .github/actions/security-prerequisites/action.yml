name: Security prerequisites
description: Prepare Git native hooks and uv before the workspace postinstall.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: '0.11.28'
        enable-cache: 'false'
    - name: Ensure Git supports native hook registration
      shell: bash
      run: |
        set -euo pipefail
        supported_git() {
          node -e 'const v=process.argv[1].match(/^git version (\d+)\.(\d+)\.(\d+)/); process.exit(v && (+v[1]>2 || (+v[1]===2 && +v[2]>=54)) ? 0 : 1)' "$(git --version)"
        }
        if ! supported_git; then
          case "$RUNNER_OS" in
            Linux)
              sudo add-apt-repository --yes ppa:git-core/ppa
              sudo apt-get update
              sudo apt-get install --yes git
              ;;
            macOS)
              brew update
              if brew list --versions git >/dev/null 2>&1; then
                brew upgrade git
              else
                brew install git
              fi
              export PATH="$(brew --prefix git)/bin:$PATH"
              echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo 'Security setup requires Linux/macOS with Git >= 2.54.0.' >&2
              exit 2
              ;;
          esac
          hash -r
        fi
        supported_git
        git --version
        uv --version
